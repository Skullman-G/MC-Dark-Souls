buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '5.1.+', changing: true
        classpath group: 'org.spongepowered', name: 'mixingradle', version: '0.7-SNAPSHOT'
    }
}

plugins {
    id 'eclipse'
    id 'maven-publish'
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'org.spongepowered.mixin'

version = modVersion
group = modGroup
archivesBaseName = modId

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

minecraft {
    mappings channel: 'official', version: '1.18.2'

    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        client {
            workingDirectory project.file('run')
            mods {
                "${modId}" {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')
            mods {
			    "${modId}" {
			        source sourceSets.main
			    }
			}
        }
        
        gameTestServer {
            workingDirectory project.file('run')
            mods {
			    "${modId}" {
			        source sourceSets.main
			    }
			}
        }

        data {
            workingDirectory project.file('run')
            
            args '--mod', 'darksouls', '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
			
            mods {
			    "${modId}" {
			        source sourceSets.main
			    }
			}
        }
    }
}

wrapper {
    gradleVersion = '7.6'
    distributionType = Wrapper.DistributionType.ALL
}

sourceSets {
    main {
        resources.srcDir 'src/generated/resources'
    }
}

repositories {
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.18.2-40.3.0'
    
	compileOnly annotationProcessor("io.github.llamalad7:mixinextras-common:0.5.0")
    implementation jarJar("io.github.llamalad7:mixinextras-forge:0.5.0") {
        jarJar.ranged(it, "[0.5.0,)")
    }
}

mixin {
    add sourceSets.main, 'darksouls.mixin.refmap.json'
    config 'darksouls.mixin.json'
}

jar {
    manifest {
        attributes ([
            "Specification-Title": modName,
            "Specification-Vendor": modAuthor,
            "Specification-Version": modVersion,
            "Implementation-Title": project.name,
            "Implementation-Version": modVersion,
            "Implementation-Vendor" : modAuthor,
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

jar.finalizedBy('reobfJar')

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
